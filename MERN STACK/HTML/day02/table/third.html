<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rowspan</title>
    </head>
    <body>
        <table border="1">
            <thead>
                <tr>
                    <th>Column 1</th>
                    <th>Column 2</th>
                    <th>Column 3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">row1 cell1</td>
                    <td>row1 cell2</td>
                    <td>row1 cell3</td>
                </tr>
                <tr>
                    <td>row2 cell2</td>
                    <td>row1 cell3</td>
                </tr>
                <tr>
                    <td colspan="3">row3 cell1</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
