<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration form</title>
        <link rel="stylesheet" href="practice.css">
    </head>
    <body>
        <main>
            <h1>University Registration form</h1>
            <p>Please fill out the form below to register</p>
            <hr><h2>Personal details</h2>
            
            <label for="fname">First Name: </label>
            <input type="text" name="userfname" id="fname" placeholder="e.g:Nikhil"><br><br>
            
            <label for="lname">Last Name:</label>
            <input type="text" name="userlname" id="lname" placeholder="e.g: Chakrwarti"><br><br>
            
            <label for="dob">Date of Birth:</label>
            <input type="date" name="dob" id="dob"><br><br>
            
            <label for="gender">Gender:</label><br>

            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label><br>

            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label><br>

            <input type="radio" name="gender" id="Other" value="other">
            <label for="female">Other</label><br><br>
            <label for="photo">Upload your photo:</label><br>
            <input type="file" name="photo" id="photo"><br>
            <hr>
            <h2>Contact information</h2>
            <label for="email">Email Address:</label>
            <input type="email" name="email" id="email" placeholder="nikhil123@gmail.com"><br><br>
            
            <label for="phonenumber">Phone Number:</label>
            <input type="tel" name="phonenumber" id="phonenumber" placeholder="e.g: 1234567890"><br><br>
            
            <label for="address">Mailing Address: </label><br>
            <textarea name="address" id="address" rows="4" cols="25" placeholder="Street Address, City, State, PIN Code"></textarea>
            <hr>
            <h2>Academic information</h2>
            <label for="course">Select your course:</label><br>
            <select name="course" id="course">
                <option value="select course option">select course option</option>
                <option value="CSE">CSE</option>
                <option value="ME">ME</option>
                <option value="CE">CE</option>
            </select><br><br>
            <label>Extra Curricular Interest</label><br>
            <input type="checkbox" name="interest" id="sports" value="sports">
            <label for="sports">Sports</label><br>
            <input type="checkbox" name="interest" id="sports" value="Music$Arts">
            <label for="sports">Music$Arts</label><br>
            <input type="checkbox" name="interest" id="sports" value="Technology Clubs">
            <label for="sports">Technology Clubs</label><br>
            <input type="checkbox" name="interest" id="sports" value="Volunteering">
            <label for="sports">Volunteering</label><br><br>
            <hr>
            <h2>Create our account</h2>
            <label for="passwd">Create a Password</label>
            <input type="password" name="password" id="passwd"><br><br>
            <label for="security">Security Questions:</label>
            <select name="security" id="security">
                <option value="petsName">What's your first pet name</option>
                <option value="place">What's your favourite place</option>
                <option value="person">Who's your favourite person</option>
            </select><br><br>
            <label for="secu">Security Answer:</label>
            <input type="text" name="security Answer" id="secu"><br><br>
            <input type="radio" name="agreed">
            <label for="agreed">I agree to the Terms and Conditions.</label><br><br><hr>
            <button>Register</button>
            <button>Clear Form</button>
        </main>
    </body>
</html>
